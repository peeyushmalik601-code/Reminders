<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reminder Push</title>
<style>
  :root {
    --bg-base: #0a0a14;
    --bg-gradient: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.5), transparent 50%),
                   radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.4), transparent 50%),
                   radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.3), transparent 50%);
    --glass-bg: rgba(20, 25, 45, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    --text-main: #ffffff; --text-muted: #a1a1aa;
    --accent: #8b5cf6; --accent-hover: #7c3aed;
    --danger: #ef4444; --input-bg: rgba(0, 0, 0, 0.3);
    --color-scheme: dark;
  }
  [data-theme="light"] {
    --bg-base: #f8fafc;
    --bg-gradient: radial-gradient(circle at 15% 50%, rgba(167, 139, 250, 0.4), transparent 50%),
                   radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.4), transparent 50%),
                   radial-gradient(circle at 50% 80%, rgba(244, 114, 182, 0.3), transparent 50%);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    --text-main: #0f172a; --text-muted: #475569;
    --accent: #6366f1; --accent-hover: #4f46e5;
    --danger: #dc2626; --input-bg: rgba(255, 255, 255, 0.8);
    --color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-base); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); padding: 24px 16px 80px; transition: background 0.4s ease, color 0.4s ease; color-scheme: var(--color-scheme); }
  .wrap { max-width: 640px; margin: 0 auto; position: relative; }

  /* Header & Theme */
  header { text-align: center; margin-bottom: 24px; position: relative; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; }
  .sub { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }
  .theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: var(--glass-shadow); transition: all 0.2s; }

  /* Cards & Forms */
  .card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; box-shadow: var(--glass-shadow); }
  .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  label { font-size: 12.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  input, textarea, select { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); font-size: 15px; font-family: inherit; outline: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .custom-date-btn { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); font-size: 15px; text-align: left; display: flex; justify-content: space-between; cursor: pointer; }
  .quick-times { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick-btn { background: var(--glass-bg); color: var(--text-muted); border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  button { cursor: pointer; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; padding: 15px 20px; transition: transform .1s; }
  button:active { transform: scale(0.97); }
  .primary { flex: 1; background: var(--accent); color: #fff; }
  .cancel-edit { display: none; background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .setup { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; padding: 16px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
  .setup.ok { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); color: #4ade80; }
  .setup button { margin-top: 12px; background: #fbbf24; color: #000; width: 100%; }

  /* Tabs */
  .tabs { display: flex; gap: 10px; margin: 30px 0 16px; }
  .tab-btn { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 12px; border-radius: 12px; font-weight: 700; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* List Items */
  .item { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-left: 4px solid var(--accent); border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; gap: 16px; box-shadow: var(--glass-shadow); position: relative; }
  .item.paused { opacity: 0.6; border-left-color: #f59e0b; }
  .item .body { flex: 1; }
  .item .t { font-weight: 700; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .item .m { font-size: 14px; color: var(--text-muted); }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 12px; font-weight: 600; }
  .pill { background: var(--input-bg); border: 1px solid var(--glass-border); padding: 4px 10px; border-radius: 999px; }
  
  /* Tags Colors */
  .tag-health { color: #f87171; } .tag-work { color: #60a5fa; }
  .tag-personal { color: #4ade80; } .tag-other { color: #a1a1aa; }

  .item-actions { display: flex; flex-direction: column; gap: 8px; }
  .icon-btn { background: transparent; border: 1px solid var(--glass-border); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--text-muted); cursor: pointer; }
  
  .empty { text-align: center; color: var(--text-muted); padding: 40px 10px; border: 1px dashed var(--glass-border); border-radius: 20px; }

  /* Modals & Toasts */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; width: 100%; max-width: 360px; box-shadow: var(--glass-shadow); }
  
  /* Calendar */
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-header button { background: var(--input-bg); border: 1px solid var(--glass-border); width: 36px; height: 36px; border-radius: 10px; color: var(--text-main); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
  .cal-day-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-align: center; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; cursor: pointer; }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .time-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
  .time-selector select { width: auto; padding: 10px; font-size: 16px; font-weight: 700; }

  #toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
  .toast { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 12px 24px; border-radius: 100px; font-weight: 600; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reminder</h1>
    <p class="sub">Never forget a thing.</p>
    <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌙</button>
  </header>

  <div id="setup" class="setup">Checking...</div>

  <form id="form" class="card">
    <div class="row">
      <label>Title *</label>
      <input id="title" required maxlength="80" placeholder="e.g. Paani peena">
    </div>
    <div class="row">
      <label>Message (Optional)</label>
      <textarea id="msg" rows="2" maxlength="200" placeholder="Detail..."></textarea>
    </div>
    <div class="grid2">
      <div class="row">
        <label>Date & Time *</label>
        <input id="time" type="datetime-local" required style="display:none">
        <div id="customDateBtn" class="custom-date-btn"><span id="displayDate">Select</span><span>📅</span></div>
      </div>
      <div class="row">
        <label>Repeat</label>
        <select id="repeat"><option value="none">Once</option><option value="daily">Daily</option></select>
      </div>
    </div>
    <div class="row">
      <label>Category (Tag)</label>
      <select id="category">
        <option value="other">⚪ Other</option>
        <option value="health">🔴 Health</option>
        <option value="work">🔵 Work</option>
        <option value="personal">🟢 Personal</option>
      </select>
    </div>
    
    <div class="quick-times" id="quickTimes">
      <button type="button" class="quick-btn" data-mins="5">+5 Mins</button>
      <button type="button" class="quick-btn" data-mins="30">+30 Mins</button>
      <button type="button" class="quick-btn" data-mins="60">+1 Hour</button>
    </div>

    <div class="actions">
      <button type="submit" class="primary" id="submitBtn">Add Reminder</button>
      <button type="button" class="cancel-edit" id="cancelEditBtn">Cancel</button>
    </div>
  </form>

  <div class="tabs">
    <button class="tab-btn active" data-tab="active">Active</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>

  <div id="list"><div class="empty">Loading...</div></div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="confirmModal"><div class="modal-box"><p id="modalMsg"></p><div class="actions" style="margin-top:20px"><button class="cancel-edit" style="display:block" id="modalCancel">Cancel</button><button class="primary" style="background:var(--danger)" id="modalOk">Delete</button></div></div></div>

<div class="modal-overlay" id="datePickerModal">
  <div class="modal-box">
    <div class="cal-header"><button type="button" id="prevMonth">❮</button><span id="monthYearLabel"></span><button type="button" id="nextMonth">❯</button></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="time-selector"><select id="hourSelect"></select><span>:</span><select id="minuteSelect"></select></div>
    <div class="actions"><button class="cancel-edit" style="display:block" id="closeDatePicker">Cancel</button><button class="primary" id="confirmDateBtn">Set</button></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
(function () {
  "use strict";
  
  // Theme & UI helpers
  const themeToggle = document.getElementById('themeToggle');
  const currentTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
  themeToggle.onclick = () => {
    const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  };

  function showToast(msg, isError = false) {
    const t = document.createElement('div'); t.className = `toast ${isError ? 'error' : ''}`;
    t.innerHTML = (isError ? '❌ ' : '✅ ') + msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  let confirmCallback = null;
  function showConfirm(msg, onOk) {
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('confirmModal').classList.add('active');
    confirmCallback = onOk;
  }
  document.getElementById('modalCancel').onclick = () => document.getElementById('confirmModal').classList.remove('active');
  document.getElementById('modalOk').onclick = () => {
    document.getElementById('confirmModal').classList.remove('active');
    if (confirmCallback) confirmCallback();
  };

  // App Variables
  var setupEl = document.getElementById("setup"), form = document.getElementById("form"), listEl = document.getElementById("list");
  var titleEl = document.getElementById("title"), msgEl = document.getElementById("msg"), timeEl = document.getElementById("time");
  var displayDateEl = document.getElementById("displayDate"), repeatEl = document.getElementById("repeat"), categoryEl = document.getElementById("category");
  var submitBtn = document.getElementById("submitBtn"), cancelEditBtn = document.getElementById("cancelEditBtn");

  var deviceId = localStorage.getItem("deviceId") || "d_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9);
  localStorage.setItem("deviceId", deviceId);
  var editingId = null;
  var currentTab = "active"; // active | history

  // Tabs Logic
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-tab');
      loadReminders();
    };
  });

  function pad(n) { return String(n).padStart(2, "0"); }
  function updateDisplayDate(d) {
    displayDateEl.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function setDateTime(d) {
    d.setSeconds(0, 0);
    timeEl.value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
    updateDisplayDate(d);
  }
  function fmtTime(ts) { return new Date(ts).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

  // === CALENDAR MODAL LOGIC ===
  let pickerDate = new Date(), selectedDate = new Date();
  const datePickerModal = document.getElementById("datePickerModal"), monthYearLabel = document.getElementById("monthYearLabel");
  const calGrid = document.getElementById("calGrid"), hourSelect = document.getElementById("hourSelect"), minuteSelect = document.getElementById("minuteSelect");

  for(let i=0; i<24; i++) hourSelect.innerHTML += `<option value="${i}">${pad(i)}</option>`;
  for(let i=0; i<60; i++) minuteSelect.innerHTML += `<option value="${i}">${pad(i)}</option>`;

  function renderCalendar() {
    const year = pickerDate.getFullYear(), month = pickerDate.getMonth();
    monthYearLabel.textContent = pickerDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    calGrid.innerHTML = "";
    ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].forEach(d => calGrid.innerHTML += `<div class="cal-day-label">${d}</div>`);
    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate(), today = new Date();
    for (let i = 0; i < firstDay; i++) calGrid.innerHTML += `<div></div>`;
    for (let i = 1; i <= daysInMonth; i++) {
      const isSelected = (selectedDate.getDate() === i && selectedDate.getMonth() === month && selectedDate.getFullYear() === year);
      const isToday = (today.getDate() === i && today.getMonth() === month && today.getFullYear() === year);
      const div = document.createElement("div");
      div.className = `cal-day ${isSelected ? 'selected' : ''}`;
      if(isToday) div.style.border = "1px solid var(--accent)";
      div.textContent = i;
      div.onclick = () => { selectedDate.setFullYear(year, month, i); renderCalendar(); };
      calGrid.appendChild(div);
    }
  }

  document.getElementById("customDateBtn").onclick = () => {
    selectedDate = timeEl.value ? new Date(timeEl.value) : new Date(Date.now() + 5*60000);
    pickerDate = new Date(selectedDate);
    hourSelect.value = selectedDate.getHours(); minuteSelect.value = selectedDate.getMinutes();
    renderCalendar(); datePickerModal.classList.add("active");
  };
  document.getElementById("prevMonth").onclick = () => { pickerDate.setMonth(pickerDate.getMonth() - 1); renderCalendar(); };
  document.getElementById("nextMonth").onclick = () => { pickerDate.setMonth(pickerDate.getMonth() + 1); renderCalendar(); };
  document.getElementById("closeDatePicker").onclick = () => datePickerModal.classList.remove("active");
  document.getElementById("confirmDateBtn").onclick = () => {
    selectedDate.setHours(parseInt(hourSelect.value), parseInt(minuteSelect.value));
    setDateTime(selectedDate); datePickerModal.classList.remove("active");
  };

  document.getElementById("quickTimes").addEventListener("click", function(e) {
    if(e.target.classList.contains("quick-btn")) setDateTime(new Date(Date.now() + parseInt(e.target.getAttribute("data-mins")) * 60000));
  });

  // === FETCH & RENDER ===
  async function loadReminders() {
    try {
      var list = await fetch("/api/reminders?deviceId=" + encodeURIComponent(deviceId)).then(r => r.json());
      render(list);
    } catch (e) { listEl.innerHTML = '<div class="empty">Load failed</div>'; }
  }

  function render(items) {
    // Filter based on tab
    const filtered = items.filter(it => currentTab === "active" ? !it.fired : it.fired);

    if (!filtered.length) { 
      listEl.innerHTML = `<div class="empty">Koi reminder nahi hai.</div>`; return; 
    }
    filtered.sort((a, b) => a.time - b.time);
    listEl.innerHTML = "";
    
    filtered.forEach(function (it) {
      var card = document.createElement("div");
      card.className = "item" + (it.fired ? " done" : "") + (it.paused ? " paused" : "");
      
      // Category Color
      if(it.category === "health") card.style.borderLeftColor = "#f87171";
      else if(it.category === "work") card.style.borderLeftColor = "#60a5fa";
      else if(it.category === "personal") card.style.borderLeftColor = "#4ade80";
      
      var body = document.createElement("div"); body.className = "body";
      
      var t = document.createElement("div"); t.className = "t"; 
      // Add Category Dot
      let catDot = "";
      if(it.category === "health") catDot = "🔴 ";
      else if(it.category === "work") catDot = "🔵 ";
      else if(it.category === "personal") catDot = "🟢 ";
      t.innerHTML = catDot + it.title; 
      body.appendChild(t);
      
      if (it.message) { var m = document.createElement("div"); m.className = "m"; m.textContent = it.message; body.appendChild(m); }
      
      var meta = document.createElement("div"); meta.className = "meta";
      meta.innerHTML += `<span class="pill">🕒 ${fmtTime(it.time)}</span>`;
      meta.innerHTML += `<span class="pill">${it.repeat === "daily" ? "🔁 Daily" : "1️⃣ Once"}</span>`;
      if (it.paused) meta.innerHTML += `<span class="pill" style="color:#f59e0b; border-color:#f59e0b">⏸ Paused</span>`;
      if (it.fired) meta.innerHTML += `<span class="pill">✅ Done</span>`;
      body.appendChild(meta);
      card.appendChild(body);

      var actions = document.createElement("div"); actions.className = "item-actions";

      // Pause/Resume (only for daily)
      if(!it.fired && it.repeat === "daily") {
        var pauseBtn = document.createElement("button"); pauseBtn.className = "icon-btn"; 
        pauseBtn.innerHTML = it.paused ? "▶️" : "⏸";
        pauseBtn.onclick = async function() {
          await fetch("/api/reminders/" + it.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paused: !it.paused }) });
          loadReminders();
        };
        actions.appendChild(pauseBtn);
      }

      if(!it.fired) {
        var editBtn = document.createElement("button"); editBtn.className = "icon-btn"; editBtn.innerHTML = "✏️";
        editBtn.onclick = function() { startEdit(it); };
        actions.appendChild(editBtn);
      }

      var delBtn = document.createElement("button"); delBtn.className = "icon-btn"; delBtn.innerHTML = "✕"; delBtn.style.color = "var(--danger)";
      delBtn.onclick = function () {
        showConfirm("Delete this reminder?", async () => {
          await fetch("/api/reminders/" + it.id, { method: "DELETE" });
          loadReminders(); showToast("Deleted");
        });
      };
      actions.appendChild(delBtn);
      card.appendChild(actions);

      listEl.appendChild(card);
    });
  }

  // Edit & Form Logic
  function startEdit(reminder) {
    editingId = reminder.id;
    titleEl.value = reminder.title;
    msgEl.value = reminder.message || "";
    repeatEl.value = reminder.repeat;
    categoryEl.value = reminder.category || "other";
    setDateTime(new Date(reminder.time));
    submitBtn.textContent = "Update Reminder";
    cancelEditBtn.style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null; form.reset();
    setDateTime(new Date(Date.now() + 5 * 60000));
    submitBtn.textContent = "Add Reminder"; cancelEditBtn.style.display = "none";
  }
  cancelEditBtn.onclick = resetForm;

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var title = titleEl.value.trim();
    if (!title || !timeEl.value) return showToast("Title & time required", true);
    var ts = new Date(timeEl.value).getTime();
    var payload = { deviceId, title, message: msgEl.value.trim(), time: ts, repeat: repeatEl.value, category: categoryEl.value };

    if (editingId) {
      await fetch("/api/reminders/" + editingId, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      showToast("Updated!");
    } else {
      await fetch("/api/reminders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      showToast("Added!");
    }
    resetForm(); loadReminders();
  });

  // === SUBSCRIBE ===
  function urlB64ToUint8(b64) {
    var pad = "=".repeat((4 - b64.length % 4) % 4);
    var s = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  async function getReg() { return await navigator.serviceWorker.register("/sw.js", { scope: "/" }); }

  async function subscribe() {
    try {
      var reg = await getReg(); await navigator.serviceWorker.ready;
      var perm = await Notification.requestPermission();
      if (perm !== "granted") return setupEl.innerHTML = "❌ Permission denied.";
      
      var existing = await reg.pushManager.getSubscription();
      var sub = existing;
      if (!sub) {
        var keyResp = await fetch("/api/vapid-public-key").then(r => r.json());
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(keyResp.key) });
      }
      await fetch("/api/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId, subscription: sub }) });
      setupEl.className = "setup ok"; setupEl.innerHTML = "✅ Notifications active!";
      loadReminders();
    } catch (e) { setupEl.innerHTML = "❌ " + e.message; }
  }

  (async function init() {
    resetForm();
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return setupEl.innerHTML = "❌ Push not supported.";
    try {
      var reg = await getReg(); await navigator.serviceWorker.ready;
      var existing = await reg.pushManager.getSubscription();
      if (existing && Notification.permission === "granted") {
        await fetch("/api/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId, subscription: existing }) });
        setupEl.className = "setup ok"; setupEl.innerHTML = "✅ Notifications active.";
        loadReminders();
      } else {
        setupEl.innerHTML = "Notifications off.<br><button id='enableBtn'>Enable Notifications</button>";
        document.getElementById("enableBtn").onclick = subscribe;
      }
    } catch (e) { setupEl.innerHTML = "❌ " + e.message; }
    setInterval(loadReminders, 5000);
  })();
})();
</script>
</body>
</html>
